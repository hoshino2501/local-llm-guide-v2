<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ガイドさんに相談 | ローカルLLM構築ガイド</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="chat">
<header class="chat-head"><div class="wrap">
  <a class="brand" href="/">ローカルLLM構築ガイド</a>
  <div class="tabs" role="tablist" id="tabs" aria-label="ガイドさんを選ぶ"></div>
  <button class="btn ghost small" type="button" id="reset">新しい会話</button>
</div></header>
<div class="notice"><div class="wrap">質問はAmazon Bedrock(AWS)で処理されます。質問・回答の内容は保存しませんが、個人情報や機密情報は入力しないでください。AIの回答は誤りを含む場合があります。</div></div>

<div class="log" id="log" role="log" aria-live="polite" aria-label="会話"><div class="wrap" id="messages"></div></div>

<div class="composer">
  <form id="form">
    <label for="input" class="skip">質問を入力</label>
    <textarea id="input" rows="1" maxlength="4000" placeholder="質問を入力(Enterで改行、Ctrl/⌘+Enterで送信)" enterkeyhint="send"></textarea>
    <button class="btn" type="submit" id="send">送信</button>
    <button class="btn ghost" type="button" id="stop" hidden>停止</button>
  </form>
  <div class="meta"><span id="status"></span><span id="count">0 / 4000</span></div>
</div>
<noscript><div class="wrap"><p>チャットにはJavaScriptが必要です。</p></div></noscript>
<script type="module" src="/assets/chat.js"></script>
</body>
</html>
